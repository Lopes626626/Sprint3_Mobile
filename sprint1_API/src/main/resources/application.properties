spring.application.name=backend_consultas

# Configuração do H2 em modo FILE (exigência da Sprint)
spring.datasource.url=jdbc:h2:file:./data/metaindustria_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console do H2 para acessar pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Criação automática das tabelas pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect